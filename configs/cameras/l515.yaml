# Intel RealSense L515 (LiDAR). Needs the local librealsense fork's
# pyrealsense2 (branch l515-on-development, installed in the .demo venv).
# L515 minimum range is ~0.25 m; depth scale 0.25 mm handled automatically.
type: realsense
width: 1280
height: 720
fps: 30
min_depth_m: 0.25
max_depth_m: 2.5
warmup_frames: 15
# serial: "f0090050"   # pin to the rig's unit if several cameras attach

extrinsics:
  mode: eye_to_hand
  # PLACEHOLDER: identity until hand-eye calibration is run on the rig.
  # Either run the baseline repo's collect_handeye_eih.py (eye-in-hand) and
  # point hand_eye_npz at its output, or measure the static camera pose and
  # write T (T_cam2base) here.
  # hand_eye_npz: /path/to/hand_eye.npz
  T:
    - [ 0.0, -1.0,  0.0, 0.28]
    - [-1.0,  0.0,  0.0, 0.00]
    - [ 0.0,  0.0, -1.0, 0.60]
    - [ 0.0,  0.0,  0.0, 1.00]
