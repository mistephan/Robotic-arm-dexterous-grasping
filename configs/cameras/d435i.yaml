# Intel RealSense D435i (stereo). Works with stock pyrealsense2 wheels too.
type: realsense
width: 1280
height: 720
fps: 30
min_depth_m: 0.15
max_depth_m: 2.0
warmup_frames: 15

extrinsics:
  mode: eye_to_hand
  # PLACEHOLDER: calibrate on the rig (see l515.yaml notes).
  T:
    - [ 0.0, -1.0,  0.0, 0.28]
    - [-1.0,  0.0,  0.0, 0.00]
    - [ 0.0,  0.0, -1.0, 0.60]
    - [ 0.0,  0.0,  0.0, 1.00]
