name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      # kinematics (pin) unskips the FK/IK, orchestrator-e2e, mcp-server and
      # streaming tests; the heavy extras (perception/arm) stay hardware-only.
      - run: uv sync --extra dev --extra kinematics
      - run: uv run pytest tests/ -q
